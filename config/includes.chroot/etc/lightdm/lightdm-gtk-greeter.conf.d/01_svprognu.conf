# Ecran de connexion aux couleurs du theme Plymouth SVPro
[greeter]
background=/usr/share/backgrounds/svprognu/svprognu-1920x1080.png
user-background=false
theme-name=Bluebird
icon-theme-name=nuoveXT2
font-name=Cantarell 11
default-user-image=/usr/share/pixmaps/svprognu.png
position=50%,center 85%,center
indicators=~host;~spacer;~clock;~spacer;~layout;~language;~a11y;~session;~power
clock-format=%A %d %B, %H:%M
